name: Build and release گاه‌یار

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test calendar conversion
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/GahYar.exe artifact/GahYar.exe
          Copy-Item README.md artifact/README.md
          Copy-Item assets/iran-calendar-events-1405.json artifact/iran-calendar-events-1405.json
      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-win-x64
          path: artifact
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            target/x86_64-pc-windows-msvc/release/GahYar.exe `
            --title "گاه‌یار ${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md `
            --latest
