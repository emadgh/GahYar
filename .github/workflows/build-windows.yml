name: Build and release گاه‌یار

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test calendar conversion
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/GahYar.exe artifact/GahYar.exe
          Copy-Item README.md artifact/README.md
          Copy-Item assets/iran-calendar-events-1405.json artifact/iran-calendar-events-1405.json
      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-win-x64
          path: artifact
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            if (-not $match) { throw "Could not read package version from Cargo.toml" }
            $version = $match.Matches[0].Groups[1].Value
            $tag = "v$version"
          }

          gh release view "$tag" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; skipping publish."
            exit 0
          }

          gh release create "$tag" `
            target/x86_64-pc-windows-msvc/release/GahYar.exe `
            --target "${{ github.sha }}" `
            --title "گاه‌یار $tag" `
            --notes-file RELEASE_NOTES.md `
            --latest
