name: Apply tray day icon fix

on:
  push:
    branches:
      - fix/tray-day-icon-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-day-icon-polish
      - name: Patch tray day icon renderer
        shell: pwsh
        run: |
          $path = 'src/main.rs'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $startMarker = 'unsafe fn create_tray_day_icon(day: u32) -> HICON {'
          $endMarker = 'unsafe fn selected_tray_icon(app: &AppState) -> (HICON, bool) {'
          $start = $text.IndexOf($startMarker, [System.StringComparison]::Ordinal)
          $end = $text.IndexOf($endMarker, $start, [System.StringComparison]::Ordinal)
          if ($start -lt 0 -or $end -lt 0) {
            throw 'Could not locate create_tray_day_icon() for patching.'
          }
          $replacement = @'
          unsafe fn create_tray_day_icon(day: u32) -> HICON {
              unsafe {
                  let screen = GetDC(null_mut());
                  if screen.is_null() {
                      return null_mut();
                  }
                  let color_dc = CreateCompatibleDC(screen);
                  let mask_dc = CreateCompatibleDC(screen);
                  let color = CreateCompatibleBitmap(screen, 32, 32);
                  let mask = CreateBitmap(32, 32, 1, 1, null());
                  if color_dc.is_null() || mask_dc.is_null() || color.is_null() || mask.is_null() {
                      if !color_dc.is_null() {
                          DeleteDC(color_dc);
                      }
                      if !mask_dc.is_null() {
                          DeleteDC(mask_dc);
                      }
                      if !color.is_null() {
                          DeleteObject(color as HGDIOBJ);
                      }
                      if !mask.is_null() {
                          DeleteObject(mask as HGDIOBJ);
                      }
                      ReleaseDC(null_mut(), screen);
                      return null_mut();
                  }

                  let old_color_bitmap = SelectObject(color_dc, color as HGDIOBJ);
                  fill_rect_color(
                      color_dc,
                      RECT {
                          left: 0,
                          top: 0,
                          right: 32,
                          bottom: 32,
                      },
                      rgb(248, 211, 88),
                  );

                  // A color icon's monochrome mask uses white pixels as transparent and black
                  // pixels as opaque. Shape the mask independently so the taskbar can show
                  // genuinely transparent corners on both light and dark themes.
                  let old_mask_bitmap = SelectObject(mask_dc, mask as HGDIOBJ);
                  PatBlt(mask_dc, 0, 0, 32, 32, WHITENESS);
                  let old_mask_brush = SelectObject(mask_dc, GetStockObject(BLACK_BRUSH) as HGDIOBJ);
                  let old_mask_pen = SelectObject(mask_dc, GetStockObject(BLACK_PEN) as HGDIOBJ);
                  RoundRect(mask_dc, 1, 1, 31, 31, 5, 5);
                  SelectObject(mask_dc, old_mask_pen);
                  SelectObject(mask_dc, old_mask_brush);

                  let font = create_font(-24, FW_BOLD as i32, "Vazirmatn");
                  draw_text(
                      color_dc,
                      &persian_digits(day),
                      RECT {
                          left: 0,
                          top: 2,
                          right: 32,
                          bottom: 32,
                      },
                      rgb(18, 18, 18),
                      font,
                      DT_CENTER | DT_VCENTER | DT_SINGLELINE | DT_RTLREADING,
                  );
                  DeleteObject(font as HGDIOBJ);
                  SelectObject(color_dc, old_color_bitmap);
                  SelectObject(mask_dc, old_mask_bitmap);
                  DeleteDC(color_dc);
                  DeleteDC(mask_dc);
                  ReleaseDC(null_mut(), screen);

                  let info = ICONINFO {
                      fIcon: 1,
                      xHotspot: 0,
                      yHotspot: 0,
                      hbmMask: mask,
                      hbmColor: color,
                  };
                  let icon = CreateIconIndirect(&info);
                  DeleteObject(mask as HGDIOBJ);
                  DeleteObject(color as HGDIOBJ);
                  icon
              }
          }

          '@.Replace("`r`n", "`n")
          $updated = $text.Substring(0, $start) + $replacement + $text.Substring($end)
          [System.IO.File]::WriteAllText(
            $path,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Commit source change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git diff --cached --check
          git commit -m "Fix tray day icon rendering (#3)"
          git push origin HEAD:fix/tray-day-icon-polish
