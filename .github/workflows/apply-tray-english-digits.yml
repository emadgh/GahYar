name: Apply tray English digits change

permissions:
  contents: write

on:
  push:
    branches:
      - feature/tray-english-digits

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source edits
        shell: pwsh
        run: .\.github\apply-tray-english-digits.ps1
