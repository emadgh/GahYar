name: Format tray icon fix

on:
  push:
    branches:
      - fix/tray-day-icon-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-day-icon-polish
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host 'No formatting changes required.'
            exit 0
          }
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "Format tray icon changes (#3)"
          git push origin HEAD:fix/tray-day-icon-polish
