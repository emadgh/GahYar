name: Fix shared updater lockfile

on:
  push:
    branches: [refactor/shared-github-updater]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Regenerate lockfile from Cargo metadata
        shell: pwsh
        run: |
          Remove-Item Cargo.lock -Force -ErrorAction SilentlyContinue
          cargo generate-lockfile
      - name: Commit generated lockfile if changed
        shell: pwsh
        run: |
          if (git status --porcelain Cargo.lock) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "build: regenerate shared updater lockfile"
            git push
          }
      - name: Test locked
        run: cargo test --locked --target x86_64-pc-windows-msvc
      - name: Build release locked
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/GahYar.exe artifact/GahYar.exe
          Copy-Item Cargo.lock artifact/Cargo.lock.resolved
      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-shared-updater-final-test
          path: artifact
          if-no-files-found: error
          retention-days: 30
