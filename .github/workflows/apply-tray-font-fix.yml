name: Apply tray font fix

on:
  push:
    branches:
      - fix/tray-transparent-font-size

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tray-transparent-font-size
      - name: Apply source changes
        run: python .github/scripts/apply_tray_font_fix.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Increase transparent tray digits and normalize font weights"
          git push
