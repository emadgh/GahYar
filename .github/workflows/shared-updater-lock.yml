name: Resolve shared updater lockfile

on:
  push:
    branches: [refactor/shared-github-updater]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-shared-updater-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
