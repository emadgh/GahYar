name: PR tray icon test build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Prepare test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/GahYar.exe artifact/GahYar.exe
          Copy-Item README.md artifact/README.md
          Copy-Item assets/iran-calendar-events-1405.json artifact/iran-calendar-events-1405.json
      - uses: actions/upload-artifact@v4
        with:
          name: GahYar-tray-icon-test-win-x64
          path: artifact
